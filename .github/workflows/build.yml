name: Build APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "build-tools;29.0.3" "platforms;android-29" > /dev/null || true

      - name: Build release APK + AAB
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleRelease :android:bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPuzzle-APK
          path: android/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPuzzle-AAB
          path: android/build/outputs/bundle/release/*.aab
