name: Build APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "build-tools;29.0.3" "platforms;android-29" > /dev/null || true

      - name: Run level-system unit tests (1000 levels)
        run: |
          chmod +x gradlew
          ./gradlew :core:test --no-daemon

      - name: Build release APK + AAB
        run: |
          ./gradlew :android:assembleRelease :android:bundleRelease --no-daemon

      - name: Re-sign APK with v1+v2+v3 for maximum compatibility
        run: |
          APK=$(ls android/build/outputs/apk/release/*.apk)
          $ANDROID_HOME/build-tools/29.0.3/apksigner sign \
            --ks android/starpuzzle.keystore --ks-key-alias piratedash \
            --ks-pass pass:piratedash2026 --key-pass pass:piratedash2026 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPuzzle-APK
          path: android/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPuzzle-AAB
          path: android/build/outputs/bundle/release/*.aab
